# xcodegen project spec — Conduit (native SwiftUI)
# Generate with: xcodegen generate
# Then open Conduit.xcodeproj in Xcode

name: Conduit
options:
  bundleIdPrefix: com.milim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: U2TH557QA8
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.15"
    CURRENT_PROJECT_VERSION: "162"
packages:
  # GPT-Live voice runs over WebRTC; Apple ships no WebRTC stack. Prebuilt
  # Google WebRTC as a binary xcframework, pinned to an exact release.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
targets:
  Conduit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Conduit
        excludes:
          - "Resources/AlternateIcons/**"
      - path: Conduit/Resources/AlternateIcons
        buildPhase: resources
      # End-to-end encrypted notifications (#431), shared with the
      # Notification Service Extension. Also the Apple Watch proof of
      # concept's link format and audio codec (Shared/WatchVoice,
      # designs/apple-watch-voice.md), shared with the Watch app.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay
        PRODUCT_NAME: Conduit
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Conduit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: Conduit/Conduit.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Conduit App Store"
        # The draft-stripping phase below deletes lprojs it can't declare
        # up front, which the user-script sandbox would refuse.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: WebRTC
      - target: ConduitWatch
      # Embedded as Conduit.app/PlugIns/ConduitNotificationService.appex.
      - target: ConduitNotificationService
    postBuildScripts:
      # A draft language (Info.plist ConduitDraftLanguages) is compiled from
      # the String Catalogs like any other; drop its lproj so it never ships.
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/$INFOPLIST_FILE" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
  # Apple Watch proof of concept (designs/apple-watch-voice.md): the
  # Watch as the microphone and speaker of a call the iPhone runs. A test
  # build's target, embedded in the iPhone app; signed automatically so
  # Xcode registers its App ID on the first archive.
  ConduitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ConduitWatch
      - path: Shared/WatchVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay.watchkitapp
        PRODUCT_NAME: ConduitWatch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
  ConduitNotificationService:
    # Decrypts end-to-end encrypted notifications before iOS shows them
    # (#431). APNs still targets com.milim.relay; this App ID has no Push
    # capability of its own.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConduitNotificationService
      - path: Shared
        # The Watch proof of concept's code, which the extension never uses.
        excludes:
          - "WatchVoice/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay.NotificationService
        PRODUCT_NAME: ConduitNotificationService
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitNotificationService/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: ConduitNotificationService/ConduitNotificationService.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Conduit Notification Service App Store"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ConduitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConduitTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
  ConduitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConduitUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
