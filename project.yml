# xcodegen project spec — Conduit (native SwiftUI)
# Generate with: xcodegen generate
# Then open Conduit.xcodeproj in Xcode

name: Conduit
options:
  bundleIdPrefix: com.milim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: U2TH557QA8
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.17"
    CURRENT_PROJECT_VERSION: "181"
packages:
  # GPT-Live voice runs over WebRTC; Apple ships no WebRTC stack. Prebuilt
  # Google WebRTC as a binary xcframework, pinned to an exact release.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
targets:
  Conduit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Conduit
        excludes:
          - "Resources/AlternateIcons/**"
      - path: Conduit/Resources/AlternateIcons
        buildPhase: resources
      ConduitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConduitTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
  ConduitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConduitUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
