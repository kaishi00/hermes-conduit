# xcodegen project spec — Conduit (native SwiftUI)
# Generate with: xcodegen generate
# Then open Conduit.xcodeproj in Xcode

name: Conduit
options:
  bundleIdPrefix: com.milim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: U2TH557QA8
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "2.3.0"
    CURRENT_PROJECT_VERSION: 245
    # The push relay used when Settings is blank (Info.plist
    # ConduitDefaultRelayURL). Empty means https://push.milim.dev; a build
    # signed for its own relay sets an https URL, e.g.
    # xcodebuild CONDUIT_DEFAULT_RELAY_URL=https://push.example.com
    CONDUIT_DEFAULT_RELAY_URL: ""
    # The app's link scheme (Info.plist CFBundleURLSchemes, ConduitAppLink).
    # Conduit Dev (scripts/mac-dev) registers its own, so conduit:// links
    # keep opening the installed Conduit.
    CONDUIT_URL_SCHEME: conduit
packages:
  # GPT-Live voice runs over WebRTC; Apple ships no WebRTC stack. Prebuilt
  # Google WebRTC as a binary xcframework, pinned to an exact release.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
# Each shipped target that calls a required-reason API keeps its
# PrivacyInfo.xcprivacy at its folder's root; xcodegen bundles it with that
# folder's sources (ConduitTests/PrivacyManifestTests.swift checks them).
targets:
  Conduit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Conduit
        excludes:
          - "Resources/AlternateIcons/**"
      - path: Conduit/Resources/AlternateIcons
        buildPhase: resources
      # End-to-end encrypted notifications (#431), shared with the
      # Notification Service Extension. Also the Apple Watch app's link
      # format and relay wires (Shared/WatchVoice,
      # designs/apple-watch-voice-direct.md) and Gemini Live's protocol and
      # session (Shared/GeminiLive, designs/apple-watch-voice-direct.md),
      # shared with the Watch app.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay
        PRODUCT_NAME: Conduit
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Conduit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: Conduit/Conduit.entitlements
        # Regenerated with HealthKit and the Location Push Service Extension
        # capability (com.apple.developer.location.push).
        PROVISIONING_PROFILE_SPECIFIER: "Hermes Conduit App Store"
        # The draft-stripping phase below deletes lprojs it can't declare
        # up front, which the user-script sandbox would refuse.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: WebRTC
      - target: ConduitWatch
      # Embedded as Conduit.app/PlugIns/ConduitNotificationService.appex.
      - target: ConduitNotificationService
      # The configured launcher widgets are embedded with the app.
      - target: ConduitWidgets
      # Answers the agent's on-demand locate while Conduit isn't running
      # (designs/location-awareness.md section 12).
      - target: ConduitLocationPush
      # Share text, links, pictures and files from other apps into a
      # Conduit draft (#812).
      - target: ConduitShareExtension
    postBuildScripts:
      # A draft language (Info.plist ConduitDraftLanguages) is compiled from
      # the String Catalogs like any other; drop its lproj so it never ships.
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/$INFOPLIST_FILE" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
      # An archive records the plugin version on notifier main: the stable
      # version the build asks hosts to update to (NotifierPluginStatus).
      - name: Stamp plugin version
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/stamp-plugin-version.py" \
            --info-plist "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
  # The Apple Watch app: voice calls to Hermes, Gemini Live on the Watch
  # itself or GPT-Live through the host's audio bridge
  # (designs/apple-watch-voice-direct.md, apple-watch-gpt-live.md).
  # Embedded in the iPhone app; signed automatically so Xcode registers
  # its App ID on the first archive.
  ConduitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ConduitWatch
        # The widget extension's own code (ConduitWatchWidgets).
        excludes:
          - "Widgets/**"
      - path: Shared/WatchVoice
      # The iPhone's own Gemini Live code: the Watch runs the same session
      # (designs/apple-watch-voice-direct.md).
      - path: Shared/GeminiLive
      # The iPhone's Grok Live session, which a Watch call to Grok runs
      # through the host's audio bridge.
      - path: Shared/GrokLive
      # The iPhone's Local Live session, which a Watch call to the user's
      # own speech server runs through the host's audio bridge.
      - path: Shared/LocalLive
      # Hermes' approval texts in the user's language (#1589), for the
      # Watch's approval card.
      - path: Shared/Approvals
      # GPT-Live's events, which the Watch reads and answers through the
      # host's audio bridge (designs/apple-watch-gpt-live.md).
      - path: Conduit/Voice/GPTLive/GPTLiveProtocol.swift
      # Hermes' file tags, which job results and chats read into a call
      # name as files rather than paths.
      - path: Conduit/Views/Components/GatewayMediaTags.swift
      # Hermes Desktop's directives, which the same names read as a file
      # or a card for Hermes Desktop.
      - path: Conduit/Views/Components/TranscriptDirectives.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay.watchkitapp
        PRODUCT_NAME: ConduitWatch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "ConduitWatch App Store"
        # Push Notifications, for the PushKit token calls from Hermes ring
        # on (designs/hermes-calls-watch.md). Automatic signing adds the
        # capability to the App ID. Production, as the iPhone's: the relay
        # sends only to production APNs.
        CODE_SIGN_ENTITLEMENTS: ConduitWatch/ConduitWatch.entitlements
    dependencies:
      # Embedded as ConduitWatch.app/PlugIns/ConduitWatchWidgets.appex.
      - target: ConduitWatchWidgets
  # The Watch's complication and its control for the Action button,
  # Control Center and the Smart Stack: both start a call
  # (ConduitWatch/TalkToHermesIntent.swift). watchOS 26, where Watch apps
  # first get controls. Signed automatically, as the Watch app.
  ConduitWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: ConduitWatch/Widgets
        excludes:
          - "Info.plist"
      # The control's intent runs in the app, so both build it.
      - path: ConduitWatch/TalkToHermesIntent.swift
      - path: ConduitWatch/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay.watchkitapp.widgets
        PRODUCT_NAME: ConduitWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitWatch/Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "ConduitWatch Widgets App Store"
  ConduitNotificationService:
    # Decrypts end-to-end encrypted notifications before iOS shows them
    # (#431). APNs still targets com.milim.relay; this App ID has no Push
    # capability of its own.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConduitNotificationService
      - path: Shared
        # The Watch app's code, Gemini Live, Grok Live, Local Live and
        # location sharing, which the extension never uses.
        excludes:
          - "WatchVoice/**"
          - "GeminiLive/**"
          - "GrokLive/**"
          - "LocalLive/**"
          - "Widgets/**"
          - "Location/**"
          - "ShareDraft/**"
      # Notifications in the App Language (#1144): the app's catalog,
      # resolved through NotificationLocalization.swift.
      - path: Conduit/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay.NotificationService
        PRODUCT_NAME: ConduitNotificationService
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitNotificationService/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: ConduitNotificationService/ConduitNotificationService.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Conduit Notification Service App Store"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # The app's draft languages (Conduit/Info.plist) never ship here either.
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/Conduit/Info.plist" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
  ConduitLocationPush:
    # The Location Push Service Extension: iOS launches it for a `location`
    # push (the agent's on-demand locate) and it posts one sealed fix
    # straight to the Hermes host. Reads the sharing binding, the device key
    # and the host pass the app keeps in the App Group (Shared/Location).
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConduitLocationPush
      - path: Shared
        excludes:
          - "WatchVoice/**"
          - "GeminiLive/**"
          - "GrokLive/**"
          - "LocalLive/**"
          - "Widgets/**"
          - "ShareDraft/**"
          - "Notifications/**"
          - "Approvals/**"
    # Maps lookups the host asks this iPhone for run on MapKit
    # (Shared/Location/MapsEngine.swift, designs/maps-v1-contract.md).
    dependencies:
      - sdk: MapKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay.LocationPush
        PRODUCT_NAME: ConduitLocationPush
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitLocationPush/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: ConduitLocationPush/ConduitLocationPush.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Conduit Location Push App Store"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ConduitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConduitWidgets
        excludes:
          - "Info.plist"
          - "ConduitWidgets.entitlements"
          - "Resources/**"
      - path: ConduitWidgets/Resources/Assets.xcassets
        buildPhase: resources
      - path: Shared/Widgets
      - path: Conduit/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay.widgets
        PRODUCT_NAME: ConduitWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitWidgets/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: ConduitWidgets/ConduitWidgets.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Conduit Widgets App Store"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/$INFOPLIST_FILE" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
  ConduitShareExtension:
    # Conduit in the share sheet (#812): reads what another app shared and
    # leaves it as a draft in the launcher App Group's ShareInbox folder,
    # with the chat it goes to, picked from the chat index the app keeps
    # there for its widgets. It never contacts Hermes and holds no
    # credentials; the app shows the draft in that chat's composer.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConduitShareExtension
        excludes:
          - "Info.plist"
          - "ConduitShareExtension.entitlements"
      - path: Shared/ShareDraft
      # The widgets' chat index, read only.
      - path: Shared/Widgets/WidgetSnapshot.swift
      - path: Shared/Widgets/WidgetSnapshotStore.swift
      - path: Conduit/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milim.relay.ShareExtension
        PRODUCT_NAME: ConduitShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitShareExtension/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_ENTITLEMENTS: ConduitShareExtension/ConduitShareExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Conduit Share Extension App Store"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # The app's draft languages (Conduit/Info.plist) never ship here either.
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/Conduit/Info.plist" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
  ConduitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConduitTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
  ConduitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConduitUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
  # App Store screenshots against the demo dashboard; run only by
  # .github/workflows/app-store-screenshots.yml (skips without CONDUIT_DEMO_URL).
  ConduitScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConduitScreenshots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
