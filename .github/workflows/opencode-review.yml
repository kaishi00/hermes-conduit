name: opencode-review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
concurrency:
  # Adding run-review to a fork's PR shares the PR's group with its pushes (a
  # later push supersedes that review and is reviewed itself); any other label,
  # or any label on an own-branch PR, gets one group per run, so it can't
  # cancel anything.
  group: opencode-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}${{ github.event.action == 'labeled' && (github.event.label.name != 'run-review' || github.event.pull_request.head.repo.full_name == github.repository) && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: review (${{ matrix.reviewer }})
    # The reviewer is an agent holding the review secrets, and a PR's title,
    # body and diff all reach its prompt. PRs from this repository's own
    # branches (people with push access) get it on every push. A fork's PR
    # gets it once someone with triage access or more adds the run-review
    # label after reading it, and then on every push while the label stays
    # and the PR is open, so only label PRs from contributors you trust.
    # Removing the label stops it.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled') ||
      (github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.state == 'open' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'run-review') ||
         (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-review'))))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - reviewer: MiMo V2.6 Flash
            model: mimo/mimo-v2.6-flash
          - reviewer: GLM-5.3-Flash
            model: zai-custom/glm-5.3-flash
    # No id-token: opencode uses the run's token (USE_GITHUB_TOKEN), not OIDC.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install opencode
        timeout-minutes: 8
        run: |
          opencode_version=1.18.34
          opencode_bin="$HOME/.opencode/bin/opencode"
          opencode_bin_dir="$HOME/.opencode/bin"

          opencode_version_matches=false
          if [ -x "$opencode_bin" ] \
            && installed_version=$("$opencode_bin" --version 2>/dev/null) \
            && [ "$installed_version" = "$opencode_version" ]; then
            opencode_version_matches=true
          elif command -v opencode >/dev/null 2>&1; then
            existing_opencode=$(command -v opencode)
            if [ -x "$existing_opencode" ] \
              && [ "$existing_opencode" != "$opencode_bin" ] \
              && installed_version=$("$existing_opencode" --version 2>/dev/null) \
              && [ "$installed_version" = "$opencode_version" ]; then
              opencode_bin="$existing_opencode"
              opencode_bin_dir="${existing_opencode%/*}"
              opencode_version_matches=true
            fi
          fi

          if [ "$opencode_version_matches" != true ]; then
            installer="$RUNNER_TEMP/opencode-install.sh"
            curl -fsSL \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              "https://raw.githubusercontent.com/anomalyco/opencode/v${opencode_version}/install" \
              -o "$installer"

            installed=false
            for attempt in 1 2 3; do
              if GITHUB_ACTIONS=false bash "$installer" --version "$opencode_version" --no-modify-path \
                && [ -x "$opencode_bin" ] \
                && installed_version=$("$opencode_bin" --version 2>/dev/null) \
                && [ "$installed_version" = "$opencode_version" ]; then
                installed=true
                break
              fi

              echo "opencode $opencode_version install attempt $attempt/3 failed" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 5))"
              fi
            done

            if [ "$installed" != true ]; then
              echo "Failed to install opencode $opencode_version after 3 attempts" >&2
              exit 1
            fi
          fi

          if [ ! -x "$opencode_bin" ] \
            || ! installed_version=$("$opencode_bin" --version 2>/dev/null) \
            || [ "$installed_version" != "$opencode_version" ]; then
            echo "opencode $opencode_version is not available at $opencode_bin" >&2
            exit 1
          fi

          echo "$opencode_bin_dir" >> "$GITHUB_PATH"
      # opencode reads the PR number from the event's pull_request, which a
      # manual run's event doesn't have: give it the event a pull_request run
      # for that PR would carry.
      - name: Build the pull_request event for a manual run
        id: dispatch_event
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            '' | *[!0-9]*) echo "pr_number must be a PR number, not '$PR_NUMBER'" >&2; exit 1 ;;
          esac
          event="$RUNNER_TEMP/pull_request_event.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | jq '{action: "opened", number, pull_request: ., repository: .base.repo, sender: .user}' > "$event"
          echo "path=$event" >> "$GITHUB_OUTPUT"
      # A reviewer waiting on a permission prompt nobody can answer used to
      # hold the job for the 6-hour default; opencode.json now denies every
      # prompt it would ask, and this bounds whatever else can stall a run.
      # The slowest reviews that finished took about 26 minutes.
      - name: Run opencode review
        timeout-minutes: 40
        run: GITHUB_EVENT_PATH=${DISPATCH_EVENT_PATH:-$GITHUB_EVENT_PATH} GITHUB_EVENT_NAME=pull_request GITHUB_ACTOR=${{ github.repository_owner }} opencode github run
        env:
          DISPATCH_EVENT_PATH: ${{ steps.dispatch_event.outputs.path }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # The run's own token: this repo only, the job's permissions above,
          # and it expires when the run ends.
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.model }}
          USE_GITHUB_TOKEN: "true"
          PROMPT: |
            You are a code reviewer. DO NOT modify any files. DO NOT make commits.
            DO NOT run builds or tests.
            Start the review with the label: Review by ${{ matrix.reviewer }}.

            Output a structured code review as your final message. Use this format:

            ## Summary
            (1-2 sentences on what this PR does)

            ## Findings
            For each issue found, write:
            ### [severity: critical/major/minor/nit] Title
            **File:** path:line
            **Issue:** What's wrong
            **Suggestion:** How to fix it

            ## Verdict
            APPROVE / REQUEST_CHANGES / COMMENT

            Focus areas for Swift/iOS:
            - Retain cycles (weak self in closures, especially Combine subscriptions)
            - Force unwraps (!) and implicitly unwrapped optionals
            - Concurrency issues (data races, MainActor violations, Swift 6 strict concurrency)
            - SwiftUI lifecycle bugs (onAppear side effects, state management, body re-renders)
            - Accessibility (missing labels, traits, dynamic type support)
            - Memory leaks and resource cleanup
            - Connected features: docs/FEATURE_MAP.md lists what changes together.
              If it has an entry for what this PR changes, check the PR's
              Siblings section against that entry's siblings and rulings. This
              checkout is main's copy: when the diff updates the entry, use the
              updated one. Each of these is a major finding: a sibling left out
              without a reason; a change against a ruling; a ruling the PR
              changes without naming the maintainer's decision; a sibling, code
              path or gap the PR adds or moves that its entry doesn't record. A
              PR that changes a mapped feature without updating its entry's
              Checked line is a minor finding.

            If you find no issues, say so explicitly. Do NOT summarize what you did
            or describe your process. Output only the review.
