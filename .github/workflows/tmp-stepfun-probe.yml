name: tmp stepfun probe
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
        run: |
          if [ -z "$STEPFUN_API_KEY" ]; then echo "::error::STEPFUN_API_KEY isn't set"; exit 1; fi
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 90 -H "Authorization: Bearer $STEPFUN_API_KEY" -H 'Content-Type: application/json' \
            -d '{"model":"step-5-preview","max_tokens":16,"messages":[{"role":"user","content":"Reply with OK."}]}' https://api.stepfun.ai/step_plan/v1/chat/completions)
          echo "HTTP $code"; head -c 300 out.json | sed 's/"content"/"c"/g'; echo
          case "$code" in 2??) ;; *) exit 1 ;; esac
