# TEMPORARY bisect copy on claude/project-thread-gawnx9 only: runs ConnectionSetupSettingsUITests on each all-live commit. Never merged.
name: Nightly

# The comprehensive half of hosted CI, which never gates a merge (docs/CI.md,
# CI v5). PR and push runs (ci.yml) only build and run the curated smoke
# classes; this workflow runs everything else:
#   unit       EVERY unit class except the timing families, split into
#              balanced shards from scripts/hosted-suite.json (unit_shards),
#              each shard as sequential xcodebuild batches with no retry
#   timing     the timing/performance/dormancy families from
#              scripts/hosted-suite.json, three passes as three jobs (what the
#              retired Mac gate's release mode did)
#   ui         the COMPLETE UI suite, split into balanced shards, with no retry,
#              so a flaky UI test shows up here instead of hiding in a PR run
# plan-tests.py hosted puts every discovered unit class in exactly one unit
# shard or the timing list, and every UI class in one UI shard, so no class
# is left out of both workflows (ci.yml's self-test job checks the same partition
# on every PR).
#
# Runs on main every night and on demand (Actions > Nightly > Run workflow).
# A release is validated by dispatching it on the release ref before a
# TestFlight upload. A failed scheduled run emails the repository owner.
#
# A run schedules 8 macOS jobs (2 unit shards + 3 timing repeats + 3 UI
# shards) against GitHub's 5-concurrent-macOS-jobs-per-account ceiling, so
# some queue behind the others. That is accepted at night: nothing waits on
# these results.

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SIMULATOR_NAME: "iPhone 18 Pro"
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"
  # Build budget for scripts/ci-hosted-build.sh. Every build step below pins
  # 1800 s (Xcode 27, 2026-11-13: up to five macOS jobs build side by side
  # from a day-old cache); this default only covers a new step that forgets to.
  BUILD_TIMEOUT_SECS: "1800"

jobs:
  ui:
    name: Bisect ${{ matrix.sha }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sha: [9d7d223eaabf0f347b5c2a060c610f0937a5e56c, 158eb4986ce39ca1389fdf8b4c30ee58a34215b2, dd8adf90d299d9728603403214a9b30571c8471d, c27c830ed2b988d13f8ec88a11b81c4d264fe17c, 7525ff285ffee4523f66fb1adaf8b494c0ad8bcf, 1c0f6969a77fb988e53442c4d621684b98bd66ae, 383a192748c4e49712e1d610610e942311c74172, b7a9f064f1bd1984b655d5ff9bc6c1a506b2f1ca]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: Select Xcode
        run: sudo bash scripts/ci-select-xcode.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and boot the simulator in parallel
        env:
          # The UI shards never restore a cache, so every build is clean: the
          # clean-build budget, as in PR CI (#2319).
          BUILD_TIMEOUT_SECS: "1800"
        run: bash scripts/ci-hosted-build.sh

      - name: Run this shard's UI classes
        # No retry here on purpose: this run exists to surface UI flakes.
        env:
          UI_CLASSES: "ConnectionSetupSettingsUITests"
        run: |
          set -euo pipefail
          if [ -z "$UI_CLASSES" ]; then
            echo "::error::UI shard selection is empty - refusing to run unfiltered"
            exit 1
          fi
          IFS=',' read -r -a CLASSES <<< "$UI_CLASSES"
          args=()
          for cls in "${CLASSES[@]}"; do
            args+=("-only-testing:ConduitUITests/${cls}")
          done
          xcodebuild test-without-building \
            -xctestrun "$XCRUN_FILE" \
            -destination "$DESTINATION" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 \
            -test-iterations 2 \
            "${args[@]}"
