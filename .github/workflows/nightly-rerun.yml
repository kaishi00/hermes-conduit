name: Nightly rerun

# Reruns a Nightly whose only losses are jobs GitHub never gave a runner.
# macOS arm64 capacity is short at times, and a queued job then ends
# `cancelled` with no runner and no steps ("The job was not acquired by Runner
# of type hosted even after multiple attempts"), about 40 minutes in. Nightly
# runs 2026-10-28 and 2026-10-29 lost 2 and 3 of their 8 jobs this way while
# every job that ran passed. Those jobs never ran a test, so rerunning them is
# not a retry that could hide a flaky test: a run with any job that did run
# and fail is left alone. Two reruns at most; after that the run stays red.

on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    name: Rerun unacquired jobs
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun the jobs that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" --jq '.jobs')
          # A job that ran and lost has a runner and steps; one GitHub never
          # placed has neither.
          lost=$(jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped")] | length' <<<"$jobs")
          unacq=$(jq -c '[.[] | select(.conclusion == "cancelled" and (.runner_id // 0) == 0 and (.steps | length) == 0)]' <<<"$jobs")
          unacquired=$(jq -r 'length' <<<"$unacq")
          names=$(jq -r 'map(.name) | join(", ")' <<<"$unacq")
          echo "attempt $ATTEMPT: $lost job(s) not successful, $unacquired never got a runner"
          if [ "$lost" -eq 0 ] || [ "$unacquired" -ne "$lost" ]; then
            echo "::notice::Nightly attempt $ATTEMPT has a job that ran and failed; not rerunning."
            exit 0
          fi
          echo "::notice::Rerunning Nightly run $RUN_ID: $names never got a runner."
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
