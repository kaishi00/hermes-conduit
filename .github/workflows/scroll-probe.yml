name: Scroll probe

# Temporary diagnostic for the open-chat jitter: runs the
# TranscriptPerformanceFixtureTests frame probe, then runs it again under the
# Time Profiler and summarises where each frame's main-thread time went.
# Removed before merge.

on:
  push:
    branches: [claude/project-thread-uhf9m1]

permissions:
  contents: read

concurrency:
  group: scroll-probe-${{ github.sha }}
  cancel-in-progress: true

env:
  SIMULATOR_NAME: "iPhone 17 Pro"
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"
  BUILD_TIMEOUT_SECS: "1200"

jobs:
  probe:
    name: Scroll probe
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Pick the build cache
        id: cache-key
        run: |
          set -euo pipefail
          xcode=$(xcodebuild -version | awk 'NR==1 {v=$2} /Build version/ {b=$3} END {print v "-" b}')
          echo "prefix=dd-v1-slim-$xcode-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"
          echo "xcode-prefix=dd-v1-slim-$xcode" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ci-derived-data
            !ci-derived-data/Logs
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
            ${{ steps.cache-key.outputs.xcode-prefix }}-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project-tests.yml

      - name: Build and boot the simulator in parallel
        run: bash scripts/ci-hosted-build.sh

      # Cloud threads can read a job's annotations but not its log.
      - name: Name the build errors
        if: failure()
        run: |
          grep -hE '(^|: )error:' ci-lane/build/build.log 2>/dev/null \
            | sed -e "s|$PWD/||g" -e 's/%/%25/g' | sort -u | head -n 10 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Run the probe
        run: bash .github/scroll-probe/run.sh frames

      - name: Profile the probe
        if: always()
        run: bash .github/scroll-probe/run.sh profile

      - name: Profile call tree
        if: always()
        run: bash .github/scroll-probe/run.sh tree
