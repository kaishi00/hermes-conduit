name: Scroll probe

# Temporary diagnostic for the open-chat jitter: runs only
# the TranscriptPerformanceFixtureTests scroll probe tests and
# repeats its SCROLL_PROBE lines at the end of the log. Removed before merge.

on:
  push:
    branches: [claude/project-thread-uhf9m1]

permissions:
  contents: read

concurrency:
  group: scroll-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMULATOR_NAME: "iPhone 17 Pro"
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"
  BUILD_TIMEOUT_SECS: "1200"

jobs:
  probe:
    name: Scroll probe
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Pick the build cache
        id: cache-key
        run: |
          set -euo pipefail
          xcode=$(xcodebuild -version | awk 'NR==1 {v=$2} /Build version/ {b=$3} END {print v "-" b}')
          echo "prefix=dd-v1-slim-$xcode-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"
          echo "xcode-prefix=dd-v1-slim-$xcode" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ci-derived-data
            !ci-derived-data/Logs
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
            ${{ steps.cache-key.outputs.xcode-prefix }}-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project-tests.yml

      - name: Build and boot the simulator in parallel
        run: bash scripts/ci-hosted-build.sh

      # Cloud threads can read a job's annotations but not its log.
      - name: Name the build errors
        if: failure()
        run: |
          grep -hE '(^|: )error:' ci-lane/build/build.log 2>/dev/null \
            | sed -e "s|$PWD/||g" -e 's/%/%25/g' | sort -u | head -n 10 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Run the probe
        run: |
          set -uo pipefail
          # Name, test filter, then any TEST_RUNNER_ variables for the run.
          run_probe() {
            local name=$1 filter=$2
            shift 2
            env "$@" xcodebuild test-without-building \
              -xctestrun "$XCRUN_FILE" \
              -destination "$DESTINATION" \
              -parallel-testing-enabled NO \
              -collect-test-diagnostics never \
              -only-testing:"ConduitTests/$filter" \
              > "probe-$name.log" 2>&1 || echo "probe $name exited $?"
          }
          # Each run is its own process, so none warms another's caches.
          frames=TranscriptPerformanceFixtureTests/testScrollProbeReportsWorkPerFrame
          # Runs on and off, interleaved, on the same runner.
          run_probe joined-1 "$frames"
          run_probe separate-1 "$frames" TEST_RUNNER_PROBE_JOINS=0
          run_probe joined-2 "$frames"
          run_probe separate-2 "$frames" TEST_RUNNER_PROBE_JOINS=0
          for name in joined-1 separate-1 joined-2 separate-2; do
            echo "===== $name"
            # Three slowest frames per phase; the stacks only when asked for.
            grep -E "SCROLL_PROBE|^Test Case .*(passed|failed)" "probe-$name.log" \
              | grep -v "SCROLL_PROBE stack" \
              | awk '/ slow frame=/{if (++seen[$2] > 3) next} {print}' \
              || tail -n 40 "probe-$name.log"
            # The first failure's whole message, which carries the test's trace.
            awk '/: error: /{p=1} p{print; n++} /^Test Case .* failed/{if (p) exit} n>=60{exit}' "probe-$name.log"
          done > probe-summary.txt
          cat probe-summary.txt
          # Cloud threads read annotations, not the log: the summary goes
          # out as notices and warnings (10 of each per step), each under
          # the 4,096 characters an annotation keeps.
          python3 - probe-summary.txt <<'PY'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          chunks, current = [], ""
          def encode(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for line in lines:
              line = encode(line[:600] + "\n")
              if current and len(current) + len(line) > 3900:
                  chunks.append(current)
                  current = ""
              current += line
          if current:
              chunks.append(current)
          for index, chunk in enumerate(chunks[:20]):
              kind = "notice" if index < 10 else "warning"
              print(f"::{kind} title=probe {index + 1}/{len(chunks)}::{chunk}")
          PY
