name: Scroll probe

# Temporary diagnostic for the open-chat jitter: runs only
# the TranscriptPerformanceFixtureTests scroll probe tests and
# repeats its SCROLL_PROBE lines at the end of the log. Removed before merge.

on:
  push:
    branches: [claude/project-thread-uhf9m1]

permissions:
  contents: read

concurrency:
  group: scroll-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMULATOR_NAME: "iPhone 17 Pro"
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"
  BUILD_TIMEOUT_SECS: "1200"

jobs:
  probe:
    name: Scroll probe
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Pick the build cache
        id: cache-key
        run: |
          set -euo pipefail
          xcode=$(xcodebuild -version | awk 'NR==1 {v=$2} /Build version/ {b=$3} END {print v "-" b}')
          echo "prefix=dd-v1-slim-$xcode-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"
          echo "xcode-prefix=dd-v1-slim-$xcode" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ci-derived-data
            !ci-derived-data/Logs
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
            ${{ steps.cache-key.outputs.xcode-prefix }}-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project-tests.yml

      - name: Build and boot the simulator in parallel
        run: bash scripts/ci-hosted-build.sh

      - name: Run the probe
        run: |
          set -uo pipefail
          run_probe() {
            xcodebuild test-without-building \
              -xctestrun "$XCRUN_FILE" \
              -destination "$DESTINATION" \
              -parallel-testing-enabled NO \
              -collect-test-diagnostics never \
              -only-testing:"ConduitTests/TranscriptPerformanceFixtureTests/$1" \
              > "probe-$2.log" 2>&1 || echo "probe $2 exited $?"
          }
          # The frame probe runs on its own, first, so no other test warms
          # its caches or leaves state behind.
          run_probe testScrollProbeReportsWorkPerFrame frames-1
          run_probe testScrollProbeReportsWorkPerFrame frames-2
          run_probe testScrollProbeReportsMountCostByRow mount
          for name in frames-1 frames-2 mount; do
            echo "===== $name"
            grep -E "SCROLL_PROBE|error:|failed|passed" "probe-$name.log" | grep -v "^Test Suite" || tail -n 80 "probe-$name.log"
          done
