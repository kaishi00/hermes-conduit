name: CI

# CI v5 - GitHub-hosted CI is the only merge gate, and it is light on
# purpose (see docs/CI.md):
#
#   PR / push (this file)   the cheap Linux validation, then ONE macOS job that
#                           compiles the app (without its Watch app and
#                           extensions unless a PR touches them, see the plan
#                           job's ui-spec) and all test targets once, and runs
#                           the curated unit smoke classes and the curated UI
#                           smoke classes (scripts/smoke-suite.json) on that
#                           build and simulator.
#   Nightly (nightly.yml)   EVERY unit class in balanced shards, the
#                           timing/performance/dormancy families with repeats,
#                           and the complete UI suite. Also how a release is
#                           validated: dispatch it on the release ref.
#
# Jobs:
#   plan       (ubuntu)  inventory/planner validation, localization coverage,
#                        plugin version, CI-tooling tests, the smoke selection
#                        (scripts/smoke-suite.json) and the nightly partition
#                        (scripts/hosted-suite.json), both validated against
#                        the discovered inventory, and the smoke build's
#                        project (ui-spec).
#   self-test  (ubuntu)  three fixed discovery groups in parallel.
#   smoke      (macos)   builds its test products while its simulator boots in
#                        the background, then runs the unit smoke classes (one
#                        invocation, no retry) and the UI smoke classes (one
#                        invocation, one targeted retry). A unit failure does
#                        not skip the UI step; the job fails if either did.
#   ci-gate    (ubuntu)  the single stable branch-protection check.
#
# One macOS job per run: GitHub allows 5 concurrent macOS jobs per account,
# and runner queueing, not test time, was what made the three-job CI v4 shape
# slow. A PR's superseded runs are cancelled. A newer push to main never
# cancels an older one's run, so back-to-back merges overlap and each adds one
# macOS job.

on:
  push:
    branches: [main, pulse]
  pull_request:
    # pulse: the internal-tester branch with the Pulse settings page (never merged into main).
    branches: [main, pulse]

# A PR's newer push supersedes its older run. A push to main is grouped by its
# own commit instead, so every merge gets a full run: branch protection does
# not require PRs to be up to date with main, so this run is what catches two
# PRs that pass alone but break together.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Known simulator, used directly as the xcodebuild destination - no
  # 'simctl list' enumeration on the happy path. macos-26 images ship the
  # iPhone 17 family; override here if an image refresh renames devices.
  SIMULATOR_NAME: "iPhone 17 Pro"
  # Workspace-anchored DerivedData: GITHUB_WORKSPACE is byte-identical across
  # GitHub-hosted runners for this repo (/Users/runner/work/<repo>/<repo>),
  # so absolute paths inside the .xctestrun are stable from run to run - no
  # path rewriting involved.
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"

jobs:
  plan:
    name: Plan & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unit-csv: "${{ steps.smoke.outputs.unit-csv }}"
      ui-csv: "${{ steps.smoke.outputs.ui-csv }}"
      ui-spec: "${{ steps.spec.outputs.ui-spec }}"
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull_request checkout is the merge commit: HEAD^1 is the base.
          fetch-depth: 2

      - name: Validate inventory + planner regression tests
        env:
          # The minutes-long bash meta-suites (lane-runner state machine,
          # destination lookup) run in the dedicated self-test job - they must
          # never delay planning or risk this job's timeout.
          CONDUIT_CI_SKIP_BASH_WRAPPER_TESTS: "1"
        run: |
          set -euo pipefail
          # The planner owns inventory discovery, so its own completeness
          # invariant (every discovered XCTestCase class planned exactly once)
          # is checked on every run.
          python3 scripts/plan-tests.py validate --repo-root . \
            --baseline scripts/test-timings.json
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Localization catalog coverage
        # Cheap Linux guard: every String(localized:) / SwiftUI literal call
        # site must resolve to a key in Conduit/Localizable.xcstrings, so a
        # translated string can never silently render English again.
        run: python3 scripts/check-l10n-coverage.py --repo-root .

      - name: Text follows Text Size
        # Text set in a fixed point size stays small at accessibility text
        # sizes while the text around it grows (#830).
        run: python3 scripts/check-fixed-text-sizes.py --repo-root .

      - name: Recommended plugin version matches the plugin
        # Conduit only offers the plugin update to hosts below
        # NotifierPluginStatus.recommendedVersion, so it must follow every
        # plugin release on hermes-conduit-notifier main.
        run: python3 scripts/check-plugin-version.py --repo-root .

      - name: Card schema matches the plugin's
        # Conduit/Cards/card-schema.json and the shared test vectors are
        # copies of hermes-conduit-notifier main's cards/, so the two sides
        # read one definition.
        run: python3 scripts/check-card-schema.py --repo-root .

      - name: Select the hosted smoke suite
        id: smoke
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          python3 scripts/plan-tests.py smoke --repo-root . \
            --suite scripts/smoke-suite.json --out ci-artifacts/smoke.json
          echo "unit-csv=$(jq -r '.unit_csv' ci-artifacts/smoke.json)" >> "$GITHUB_OUTPUT"
          echo "ui-csv=$(jq -r '.ui_csv' ci-artifacts/smoke.json)" >> "$GITHUB_OUTPUT"

      - name: Validate the nightly partition
        # These shards never run on a PR, but a PR that renames a nightly-only
        # class fails now instead of at night: every discovered unit class must land
        # in exactly one nightly unit shard or the nightly-only timing list,
        # and every UI class in a nightly UI shard. nightly.yml runs the same
        # command for its own matrices.
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          python3 scripts/plan-tests.py hosted --repo-root . \
            --suite scripts/hosted-suite.json --out ci-artifacts/hosted.json
          {
            echo "### Nightly unit shards"
            echo
            jq -r '.unit_shards | to_entries[] | "- shard \(.key + 1): \(.value | split(",") | length) classes"' ci-artifacts/hosted.json
            echo "- timing families (nightly only): $(jq -r '.nightly_unit_csv' ci-artifacts/hosted.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Choose the smoke project
        # The smoke job builds project-tests.yml (the app without its Watch
        # app and extensions, which no test runs) unless the change could
        # break those targets: their own folders, the shared code they
        # compile, the project spec, or any push to main. Then it builds the
        # whole app as shipped.
        id: spec
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fails closed: anything but GitHub's merge commit for this PR (its
          # second parent, HEAD^2, is the PR head) or an unreadable or empty
          # diff builds the full app.
          spec=project.yml
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_HEAD" ] \
            && [ "$(git rev-parse -q --verify 'HEAD^2' || true)" = "$PR_HEAD" ] \
            && changed=$(git diff --name-only HEAD^1 HEAD) && [ -n "$changed" ]; then
            # grep reads all its input (no -q): stopping at the first match could
            # kill printf with SIGPIPE, which pipefail would read as "no match".
            if ! printf '%s\n' "$changed" | grep -E '^(ConduitWatch|ConduitWidgets|ConduitNotificationService|ConduitLocationPush|ConduitShareExtension|Shared)/|^project(-tests)?\.yml$|^Conduit/Voice/GPTLive/GPTLiveProtocol\.swift$' >/dev/null; then
              spec=project-tests.yml
            fi
          fi
          echo "ui-spec=$spec" >> "$GITHUB_OUTPUT"
          echo "- smoke project: \`$spec\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke selection summary
        run: |
          set -euo pipefail
          python3 scripts/smoke-summary.py \
            --selection ci-artifacts/smoke.json >> "$GITHUB_STEP_SUMMARY"

  self-test:
    name: CI tooling self-test (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [fast, lane, local-gate]
    # No `needs`: the meta-suites test the CI tooling itself, not this run's
    # selection, so they start immediately and run CONCURRENTLY with the macOS
    # build instead of serially delaying it.
    runs-on: ubuntu-latest
    # Raised from 12 to 16 minutes when the gate's two-worker, merge-mode and
    # per-worker-evidence cases grew the gate integration suite, and again to 30
    # when its cap moved to 1200s: the same suite also runs inside the gate's
    # overlapped static phase, alongside two live xcodebuild chains, where it
    # measured ~900s on our Mac against ~410s standalone. The hierarchy still
    # holds with room to spare - every suite's own subprocess cap (1200s for the
    # gate suite, 480s for the lane runner) < this ceiling - so a suite always
    # reports its own failure before GitHub kills the job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run CI tooling regression suites
        # The three groups partition full discovery exactly once. The timeout
        # layering must hold: per-case synthetic-hang watchdogs (<= 6s) < each
        # wrapper's subprocess cap (1200s for the gate integration suite, 480s
        # for the lane-runner state machine) < this job ceiling (30m) - GitHub
        # must never be the first layer to kill a regression suite.
        run: |
          set -euo pipefail
          python3 scripts/ci-self-test.py --group "${{ matrix.group }}"

  smoke:
    # The only macOS job of a PR or main run: one build, one booted simulator,
    # then the unit smoke classes and the UI smoke classes on them.
    name: Smoke
    needs: plan
    runs-on: macos-26
    # 75: the UI smoke job alone needed 45 (a stalled first attempt plus the
    # one targeted retry ran past 30 minutes, which GitHub reports as
    # "cancelled" instead of a failure), and the unit smoke invocation now
    # runs on the same runner first.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Pick the build cache
        # DerivedData from the newest main build of the same project and
        # Xcode (the same runner image preferred), so ci-build-for-testing.sh
        # recompiles only what changed since. A new Xcode starts clean.
        id: cache-key
        env:
          SPEC: ${{ needs.plan.outputs.ui-spec }}
        run: |
          set -euo pipefail
          kind=full
          if [ "$SPEC" = project-tests.yml ]; then kind=slim; fi
          xcode=$(xcodebuild -version | awk 'NR==1 {v=$2} /Build version/ {b=$3} END {print v "-" b}')
          prefix="dd-v1-$kind-$xcode-${ImageVersion:-image}"
          echo "build cache: $prefix (spec $SPEC, runner image ${ImageOS:-?} ${ImageVersion:-?})"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "xcode-prefix=dd-v1-$kind-$xcode" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ci-derived-data
            !ci-derived-data/Logs
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}
          # Same runner image first; while GitHub rolls out a new image, any
          # build from the same Xcode (a mismatch only rebuilds more).
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
            ${{ steps.cache-key.outputs.xcode-prefix }}-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        # project.yml or project-tests.yml, chosen by the plan job.
        run: xcodegen generate --spec "${{ needs.plan.outputs.ui-spec }}"

      - name: Build and boot the simulator in parallel
        id: build
        # ci-prepare-smoke.sh (bounded device lookup, boot and bootstatus) runs
        # in the background while this runner compiles, so the ~2.5 min boot
        # hides behind the build. Exports XCRUN_FILE, DESTINATION and
        # SIMULATOR_UDID for the steps below.
        env:
          # 1200 like the nightly: 800-900 s builds were common (2026-10-13).
          BUILD_TIMEOUT_SECS: 1200
          # Named in the build's timing notice, to explain a clean build.
          BUILD_CACHE: ${{ steps.cache.outputs.cache-matched-key || format('none saved under {0}', steps.cache-key.outputs.prefix) }}
        run: bash scripts/ci-hosted-build.sh

      - name: Run the curated unit smoke classes
        # One representative class per risk area (scripts/smoke-suite.json),
        # as ONE xcodebuild invocation on the booted simulator: each
        # invocation has a fixed 40-100 s hosted cost before its first test
        # (2026-10-15). Every other unit class runs in the nightly unit shards
        # (nightly.yml).
        #
        # No retry of any kind: a unit failure is a test bug to fix, not
        # runner noise. -test-timeouts-enabled bounds a hung test; and
        # -collect-test-diagnostics never, because Xcode's on-failure default
        # gathers a simulator payload under its own 600s timeout (docs/CI.md).
        id: unit
        env:
          UNIT_CLASSES: "${{ needs.plan.outputs.unit-csv }}"
          UNIT_SMOKE_LOG: ci-lane/unit-smoke.log
          UNIT_TEST_ALLOWANCE_S: "180"
        run: |
          set -euo pipefail
          # Fail closed: an empty list would expand to no -only-testing filter,
          # and a bare xcodebuild would run the ENTIRE unit suite instead of the
          # curated classes.
          if [ -z "$UNIT_CLASSES" ]; then
            echo "::error::unit smoke selection is empty - refusing to run unfiltered"
            exit 1
          fi
          if [ -z "${DESTINATION:-}" ]; then
            echo "::error::DESTINATION is empty - the build step did not pin a simulator destination"
            exit 1
          fi
          IFS=',' read -r -a CLASSES <<< "$UNIT_CLASSES"
          UNIT_SMOKE_LOG="${UNIT_SMOKE_LOG:-ci-lane/unit-smoke.log}"
          mkdir -p "$(dirname "$UNIT_SMOKE_LOG")"
          args=()
          for cls in "${CLASSES[@]}"; do
            args+=("-only-testing:ConduitTests/${cls}")
          done

          echo "unit smoke: ${#CLASSES[@]} classes in one invocation"
          started=$(date +%s)
          rc=0
          xcodebuild test-without-building \
            -xctestrun "$XCRUN_FILE" \
            -destination "$DESTINATION" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance "${UNIT_TEST_ALLOWANCE_S:-180}" \
            "${args[@]}" 2>&1 | tee "$UNIT_SMOKE_LOG" || rc=$?
          # How long the invocation took and how much of that ran tests.
          total=$(( $(date +%s) - started ))
          executed=$(grep -E '^[[:space:]]*Executed [0-9]+ tests?, with' "$UNIT_SMOKE_LOG" | tail -n 1 || true)
          tests=$(printf '%s\n' "$executed" | sed -nE 's/^[[:space:]]*Executed ([0-9]+) tests?.*/\1/p')
          wall=$(printf '%s\n' "$executed" | sed -nE 's/.* \(([0-9]+)(\.[0-9]+)?\) seconds$/\1/p')
          if [ -n "$tests" ] && [ -n "$wall" ]; then
            echo "::notice title=unit smoke took ${total}s::$tests tests ran for ${wall}s of it"
          else
            echo "::notice title=unit smoke took ${total}s::its output has no test totals"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::unit smoke failed: $UNIT_CLASSES"
            # The failing cases go in an annotation too, readable without the
            # log: xcodebuild's own list of failing tests first (its first 40
            # lines, then a marker if it is longer), then the first messages
            # and crashes.
            failing_list=$(awk '/^Failing tests:/ { on = 1; print; next }
              on && /^[[:space:]]+[^[:space:]]/ { print; next }
              { on = 0 }' "$UNIT_SMOKE_LOG" \
              | awk 'NR <= 40 { print } NR == 41 { print "\t(more failing tests in the job log)" }' || true)
            details=$(grep -E ": error: -\[|Test Case '.*' failed|Restarting after unexpected exit|✘" "$UNIT_SMOKE_LOG" \
              | head -n 20 || true)
            failures=$(printf '%s\n%s\n' "$failing_list" "$details" | sed '/^$/d')
            if [ -n "$failures" ]; then
              echo "::error title=unit smoke failures::$(printf '%s\n' "$failures" | sed 's/%/%25/g' | awk '{printf "%s%s", (NR > 1 ? "%0A" : ""), $0}')"
            fi
            exit 1
          fi

      - name: Remove the app before UI smoke
        # The unit classes run inside the app as their test host, so its data
        # container (defaults, saved chats, files) holds whatever they left.
        # UI smoke used to get a fresh simulator; uninstalling gives it a
        # fresh container instead (test-without-building installs the app
        # again). Keychain items outlive an uninstall on the simulator.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # com.milim.relay is project.yml's PRODUCT_BUNDLE_IDENTIFIER for Conduit.
          if ! xcrun simctl uninstall "${SIMULATOR_UDID:-booted}" com.milim.relay; then
            echo "::warning::could not remove the app before UI smoke; UI smoke runs on the unit classes' app container"
          fi

      - name: Run the curated UI smoke suite
        # Basic launch/navigation smoke only: the full UI suite runs in the
        # nightly workflow (nightly.yml).
        #
        # Runs after a unit smoke failure too, so one red step never hides the
        # other's verdict (a failed step still fails the job); only a failed
        # build or a cancelled run skips it.
        #
        # UI classes are the one part of this gate with a measured flake rate on
        # shared runners: over three runs of this PR, two different UI tests
        # failed while the rest of the gate was green (a system photo picker that
        # did not appear inside its 15s wait; a wizard step that never advanced),
        # and one run had them green with no change. So the UI smoke job applies
        # the lane runner's own rule for a failing UI batch: ONE targeted retry
        # of the failed selected classes, with whole-selection fallback when
        # result attribution is uncertain, and the original failure reported.
        # A class that fails twice fails this job - this is
        # deliberately not rerun-until-green, and no Xcode-native retry flags are
        # used anywhere. The unit smoke step gets no such retry: a unit failure
        # is a test bug to fix, not runner noise.
        id: ui
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          UI_CLASSES: "${{ needs.plan.outputs.ui-csv }}"
          UI_SMOKE_LOG: ci-lane/ui-smoke.log
          UI_TEST_ALLOWANCE_S: "480"
        run: |
          set -euo pipefail
          # Fail closed: an empty list would expand to no -only-testing filter,
          # and a bare xcodebuild would run the ENTIRE UI suite instead of the
          # two curated classes.
          if [ -z "$UI_CLASSES" ]; then
            echo "::error::UI smoke selection is empty - refusing to run unfiltered"
            exit 1
          fi
          if [ -z "${DESTINATION:-}" ]; then
            echo "::error::DESTINATION is empty - the prepare step did not pin a simulator destination"
            exit 1
          fi
          IFS=',' read -r -a CLASSES <<< "$UI_CLASSES"
          UI_SMOKE_LOG="${UI_SMOKE_LOG:-ci-lane/ui-smoke.log}"
          mkdir -p "$(dirname "$UI_SMOKE_LOG")"

          RESULT_DIR=$(mktemp -d "$(dirname "$UI_SMOKE_LOG")/ui-results.XXXXXX")
          # The 480s per-test allowance ends a hung UI test (seen: an app launch
          # that hung 25 min, and a 621s idle-wait stall) so the targeted retry
          # still runs inside the job timeout. The slowest passing hosted test
          # took 246s.
          run_classes() {
            local result_bundle="$1"
            shift
            local args=()
            local cls
            for cls in "$@"; do
              args+=("-only-testing:ConduitUITests/${cls}")
            done
            xcodebuild test-without-building \
              -xctestrun "$XCRUN_FILE" \
              -destination "$DESTINATION" \
              -parallel-testing-enabled NO \
              -collect-test-diagnostics never \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance "${UI_TEST_ALLOWANCE_S:-480}" \
              -resultBundlePath "$result_bundle" \
              "${args[@]}"
          }

          echo "UI smoke: ${#CLASSES[@]} classes"
          rc=0
          run_classes "$RESULT_DIR/initial.xcresult" "${CLASSES[@]}" 2>&1 | tee "$UI_SMOKE_LOG" || rc=$?
          if [ "$rc" -ne 0 ]; then
            retry_csv=$(python3 scripts/smoke-retry-classes.py \
              --classes "$UI_CLASSES" --xcresult "$RESULT_DIR/initial.xcresult" \
              --out "$(dirname "$UI_SMOKE_LOG")/ui-retry.json") || retry_csv="$UI_CLASSES"
            # The extractor falls back to the entire selection for incomplete,
            # synthetic, unknown, or unreadable results; never an empty filter.
            retry_csv="${retry_csv:-$UI_CLASSES}"
            IFS=',' read -r -a RETRY_CLASSES <<< "$retry_csv"
            echo "::warning::UI smoke failed; one targeted retry of: $retry_csv"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '### Hosted UI retry\n\nInitial classes: `%s`. Retry classes: `%s`.\n' \
                "$UI_CLASSES" "$retry_csv" >> "$GITHUB_STEP_SUMMARY"
            fi
            run_classes "$RESULT_DIR/retry.xcresult" "${RETRY_CLASSES[@]}" 2>&1 | tee -a "$UI_SMOKE_LOG" || {
              echo "::error::the UI smoke classes failed again on the targeted retry - the failure persists"
              exit 1
            }
            echo "::warning::runner-level flake absorbed: $retry_csv failed, then the targeted retry passed"
          fi

      - name: Save the build cache
        # Main's builds only (PRs restore the newest of them). A push to main
        # always builds project.yml, so this saves the full app; the app-only
        # (slim) build PRs restore is saved by nightly unit shard 1 on main.
        # After the tests, so a test failure still saves a good build.
        if: >-
          always() && steps.build.outcome == 'success'
          && steps.cache.outputs.cache-hit != 'true'
          && steps.cache-key.outputs.kind == 'full'
          && github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: |
            ci-derived-data
            !ci-derived-data/Logs
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

      - name: Upload hosted smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            ci-lane/destination/preparation.json
            ci-lane/unit-smoke.log
            ci-lane/ui-smoke.log
            ci-lane/ui-retry.json
          retention-days: 3
          if-no-files-found: ignore

  # Single stable branch-protection check: every hosted job must succeed.
  ci-gate:
    name: CI Gate
    needs: [plan, smoke, self-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Enforce final CI verdict
        run: |
          python3 scripts/ci-gate.py \
            --plan "${{ needs.plan.result }}" \
            --smoke "${{ needs.smoke.result }}" \
            --self-test "${{ needs.self-test.result }}"
