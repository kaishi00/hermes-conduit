name: CI

# CI v3 - two gates, one purpose each (see docs/CI.md):
#
#   GitHub-hosted (this file)     clean-machine BROAD SMOKE safety net for every
#                                 PR, including public/fork PRs: compile the
#                                 whole app and all test targets, run the cheap
#                                 Linux validation, then a curated
#                                 representative slice of unit and UI classes on
#                                 macOS. It answers "does this build, and is
#                                 anything obviously broken?" and nothing else.
#
#   Mac local exhaustive gate     TRUSTED-HEAD correctness gate for a release
#                                 or a risky merge: the COMPLETE unit and UI
#                                 suites, the timing/performance/dormancy
#                                 families with unconditional repeats, and
#                                 bounded infrastructure recovery.
#                                 `scripts/local-ci-gate.sh` - never GitHub
#                                 runners.
#
# Jobs:
#   plan       (ubuntu)  inventory/planner validation, localization coverage,
#                        CI-tooling tests, and the smoke SELECTION
#                        (scripts/smoke-suite.json, validated against the
#                        discovered inventory so a rename cannot silently
#                        shrink hosted coverage).
#   self-test  (ubuntu)  the CI-tooling regression suites, including the
#                        minutes-long bash state machines.
#   build      (macos)   build-for-testing exactly once; audit the .xctestrun
#                        for absolute-path portability; upload the products.
#   unit-smoke (macos)   the curated unit classes, as SEQUENTIAL xcodebuild
#                        batches of at most $SMOKE_BATCH_SIZE (7) classes -
#                        never one giant invocation.
#   ui-smoke   (macos)   the curated UI classes, ONE invocation.
#   ci-gate    (ubuntu)  the single stable branch-protection check.
#
# Deliberately NOT here: dynamic lane fanout, timing-history EWMA machinery and
# Xcode-native flake retry (-test-iterations). The smoke suite is small enough
# that per-batch watchdogs and lane balancing buy nothing, and a genuine
# assertion must fail the run rather than be re-run until it agrees. The Mac
# gate owns repeats, recovery and the timing families.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Known simulator, used directly as the xcodebuild destination - no
  # 'simctl list' enumeration on the happy path. macos-26 images ship the
  # iPhone 17 family; override here if an image refresh renames devices.
  SIMULATOR_NAME: "iPhone 17 Pro"
  # Workspace-anchored DerivedData: GITHUB_WORKSPACE is byte-identical across
  # GitHub-hosted runners for this repo (/Users/runner/work/<repo>/<repo>),
  # so absolute paths inside the .xctestrun stay valid after the artifact
  # round-trip - no path rewriting involved.
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"

jobs:
  plan:
    name: Plan & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unit-csv: "${{ steps.smoke.outputs.unit-csv }}"
      ui-csv: "${{ steps.smoke.outputs.ui-csv }}"
    steps:
      - uses: actions/checkout@v7

      - name: Validate inventory + planner regression tests
        env:
          # The minutes-long bash meta-suites (lane-runner state machine,
          # destination lookup) run in the dedicated self-test job - they must
          # never delay planning or risk this job's timeout.
          CONDUIT_CI_SKIP_BASH_WRAPPER_TESTS: "1"
        run: |
          set -euo pipefail
          # The planner still owns inventory discovery and is what the Mac
          # exhaustive gate balances with, so its own completeness invariant
          # (every discovered XCTestCase class planned exactly once) is checked
          # on every run.
          python3 scripts/plan-tests.py validate --repo-root . \
            --baseline scripts/test-timings.json
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Localization catalog coverage
        # Cheap Linux guard: every String(localized:) / SwiftUI literal call
        # site must resolve to a key in Conduit/Localizable.xcstrings, so a
        # translated string can never silently render English again.
        run: python3 scripts/check-l10n-coverage.py --repo-root .

      - name: Select the hosted smoke suite
        id: smoke
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          python3 scripts/plan-tests.py smoke --repo-root . \
            --suite scripts/smoke-suite.json --out ci-artifacts/smoke.json
          echo "unit-csv=$(jq -r '.unit_csv' ci-artifacts/smoke.json)" >> "$GITHUB_OUTPUT"
          echo "ui-csv=$(jq -r '.ui_csv' ci-artifacts/smoke.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke selection summary
        run: |
          set -euo pipefail
          python3 scripts/smoke-summary.py \
            --selection ci-artifacts/smoke.json >> "$GITHUB_STEP_SUMMARY"

  self-test:
    name: CI tooling self-test
    # No `needs`: the meta-suites test the CI tooling itself, not this run's
    # selection, so they start immediately and run CONCURRENTLY with the macOS
    # build instead of serially delaying it.
    runs-on: ubuntu-latest
    # Raised from 12 to 16 minutes when the gate's two-worker, merge-mode and
    # per-worker-evidence cases grew the gate integration suite, and again to 30
    # when its cap moved to 1200s: the same suite also runs inside the gate's
    # overlapped static phase, alongside two live xcodebuild chains, where it
    # measured ~900s on our Mac against ~410s standalone. The hierarchy still
    # holds with room to spare - every suite's own subprocess cap (1200s for the
    # gate suite, 480s for the lane runner) < this ceiling - so a suite always
    # reports its own failure before GitHub kills the job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run CI tooling regression suites
        # Full discovery INCLUDING the bash state-machine suites. The timeout
        # layering must hold: per-case synthetic-hang watchdogs (<= 6s) < each
        # wrapper's subprocess cap (1200s for the gate integration suite, 480s
        # for the lane-runner state machine) < this job ceiling (30m) - GitHub
        # must never be the first layer to kill a regression suite.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  build:
    name: Build test products
    # NO `needs: plan`: this job compiles the tree and audits the .xctestrun,
    # and consumes nothing the plan job produces. Waiting for it put a serial
    # 1m45s in front of every run (measured on the 2026-09-24 runs). The plan
    # job still gates the VERDICT - `ci-gate` requires it - and both smoke jobs
    # still require BOTH, so a broken selection cannot produce a green gate.
    # The only cost of the overlap is that a run whose inventory is broken
    # spends its ~3 macOS build minutes before the plan job fails, which is the
    # cheap direction to be wrong in.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing (exactly once)
        env:
          BUILD_TIMEOUT_SECS: 900
        run: bash scripts/ci-build-for-testing.sh

      - name: Audit .xctestrun portability
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Prune intermediates from the products tree
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA_PATH/Build/Intermediates.noindex" \
                 "$DERIVED_DATA_PATH/Index" \
                 "$DERIVED_DATA_PATH/Logs"

      - name: Upload build products (consumed by both smoke jobs)
        # Relative path (relative to the source root, where the build script
        # wrote it); the artifact keeps the Build/... structure, and the smoke
        # jobs restore it under $DERIVED_DATA_PATH/Build so the .xctestrun's
        # absolute paths hold.
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: ci-derived-data/Build
          retention-days: 1
          if-no-files-found: error

  unit-smoke:
    name: Unit smoke
    needs: [plan, build]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download shared build products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: "${{ env.DERIVED_DATA_PATH }}/Build"

      - name: Verify restored .xctestrun paths
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          echo "XCRUN_FILE=$XCRUN_FILE" >> "$GITHUB_ENV"
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Prepare the pinned simulator destination
        # The repo's own device handling (shared with the build job and the lane
        # runner): wait for CoreSimulator to settle its device pairs on a fresh
        # runner, pin the destination by UDID instead of letting xcodebuild pick
        # the first of several devices with the same name, then boot that device
        # before handing it to a test session. The wait is fatal by design - it
        # fails fast with the device inventory when the destination never
        # appears, instead of letting xcodebuild report a misleading destination
        # error - while the boot is best-effort and every probe carries its own
        # deadline.
        #
        # LOG_DIR is ci-lib.sh's territory: bounded_run writes its per-call log
        # there, and without it every probe dies on an unbound variable (which
        # is how the first version of this step failed).
        run: |
          set -euo pipefail
          LOG_DIR="${LOG_DIR:-ci-lane/destination}"
          mkdir -p "$LOG_DIR"
          export LOG_DIR
          source scripts/ci-lib.sh
          wait_for_destination_device
          build_destination
          reset_and_boot_simulator 0
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

      - name: Run the curated unit smoke suite
        # The curated classes run as SEQUENTIAL batches of at most
        # $SMOKE_BATCH_SIZE inside this one job, never as a single invocation:
        # large single invocations repeatedly watchdog-stalled on hosted
        # macos-26 (docs/CI.md, "Sequential unit batches"), which is why the lane
        # runner batches too. No native flake retry and no recovery here - a
        # genuine assertion must fail this job; repeats and bounded recovery are
        # the Mac gate's business.
        env:
          UNIT_CLASSES: "${{ needs.plan.outputs.unit-csv }}"
          SMOKE_BATCH_SIZE: "7"
        run: |
          set -euo pipefail
          # Fail closed: an empty list would expand to no -only-testing filter,
          # and a bare xcodebuild would run the ENTIRE suite instead of nothing.
          if [ -z "$UNIT_CLASSES" ]; then
            echo "::error::unit smoke selection is empty - refusing to run unfiltered"
            exit 1
          fi
          if [ -z "${DESTINATION:-}" ]; then
            echo "::error::DESTINATION is empty - the prepare step did not pin a simulator destination"
            exit 1
          fi
          IFS=',' read -r -a CLASSES <<< "$UNIT_CLASSES"
          # Default only when UNSET: an explicitly empty value is malformed, not
          # a request for the default.
          SMOKE_BATCH_SIZE="${SMOKE_BATCH_SIZE-7}"
          case "$SMOKE_BATCH_SIZE" in
            ''|*[!0-9]*)
              echo "::error::SMOKE_BATCH_SIZE must be a positive integer, got '$SMOKE_BATCH_SIZE'"
              exit 1
              ;;
          esac
          # 10# forces base 10, so "00" and "08" are not read as octal.
          if [ "$((10#$SMOKE_BATCH_SIZE))" -lt 1 ]; then
            echo "::error::SMOKE_BATCH_SIZE must be greater than zero, got '$SMOKE_BATCH_SIZE'"
            exit 1
          fi
          echo "unit smoke: ${#CLASSES[@]} classes, batches of at most $SMOKE_BATCH_SIZE"

          run_batch() {
            batch_no="$1"
            shift
            if [ "$#" -eq 0 ]; then
              return 0
            fi
            batch_args=()
            for cls in "$@"; do
              batch_args+=("-only-testing:ConduitTests/${cls}")
            done
            echo "::group::unit smoke batch $batch_no ($# classes)"
            # Close the log group on both paths: a failing batch aborts the
            # script (set -e), so the group must be closed before returning.
            if ! xcodebuild test-without-building \
              -xctestrun "$XCRUN_FILE" \
              -destination "$DESTINATION" \
              -parallel-testing-enabled NO \
              "${batch_args[@]}"; then
              echo "::endgroup::"
              return 1
            fi
            echo "::endgroup::"
          }

          batch=0
          group=()
          for cls in "${CLASSES[@]}"; do
            group+=("$cls")
            if [ "${#group[@]}" -ge "$SMOKE_BATCH_SIZE" ]; then
              batch=$((batch + 1))
              run_batch "$batch" "${group[@]}"
              group=()
            fi
          done
          if [ "${#group[@]}" -gt 0 ]; then
            batch=$((batch + 1))
            run_batch "$batch" "${group[@]}"
          fi
          echo "unit smoke: $batch batch invocation(s) completed"

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

  ui-smoke:
    name: UI smoke
    needs: [plan, build]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download shared build products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: "${{ env.DERIVED_DATA_PATH }}/Build"

      - name: Verify restored .xctestrun paths
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          echo "XCRUN_FILE=$XCRUN_FILE" >> "$GITHUB_ENV"
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Prepare the pinned simulator destination
        # Same device handling as the unit smoke job: the UI classes are the
        # most sensitive to which device xcodebuild picks and to a device that
        # was never booted before the session started.
        run: |
          set -euo pipefail
          LOG_DIR="${LOG_DIR:-ci-lane/destination}"
          mkdir -p "$LOG_DIR"
          export LOG_DIR
          source scripts/ci-lib.sh
          wait_for_destination_device
          build_destination
          reset_and_boot_simulator 0
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

      - name: Run the curated UI smoke suite
        # Basic launch/navigation smoke only: the full UI suite is certified by
        # the Mac local gate.
        #
        # UI classes are the one part of this gate with a measured flake rate on
        # shared runners: over three runs of this PR, two different UI tests
        # failed while the rest of the gate was green (a system photo picker that
        # did not appear inside its 15s wait; a wizard step that never advanced),
        # and one run had them green with no change. So the UI smoke job applies
        # the lane runner's own rule for a failing UI batch: ONE targeted retry
        # of the curated classes, with the class that failed reported as a
        # runner-level flake. A class that fails twice fails this job - this is
        # deliberately not rerun-until-green, and no Xcode-native retry flags are
        # used anywhere. The unit smoke job gets no such retry: its classes are
        # deterministic.
        env:
          UI_CLASSES: "${{ needs.plan.outputs.ui-csv }}"
          UI_SMOKE_LOG: ci-lane/ui-smoke.log
        run: |
          set -euo pipefail
          # Fail closed: an empty list would expand to no -only-testing filter,
          # and a bare xcodebuild would run the ENTIRE UI suite instead of the
          # two curated classes.
          if [ -z "$UI_CLASSES" ]; then
            echo "::error::UI smoke selection is empty - refusing to run unfiltered"
            exit 1
          fi
          if [ -z "${DESTINATION:-}" ]; then
            echo "::error::DESTINATION is empty - the prepare step did not pin a simulator destination"
            exit 1
          fi
          IFS=',' read -r -a CLASSES <<< "$UI_CLASSES"
          UI_SMOKE_LOG="${UI_SMOKE_LOG:-ci-lane/ui-smoke.log}"
          mkdir -p "$(dirname "$UI_SMOKE_LOG")"

          run_classes() {
            local args=()
            local cls
            for cls in "$@"; do
              args+=("-only-testing:ConduitUITests/${cls}")
            done
            xcodebuild test-without-building \
              -xctestrun "$XCRUN_FILE" \
              -destination "$DESTINATION" \
              -parallel-testing-enabled NO \
              "${args[@]}"
          }

          echo "UI smoke: ${#CLASSES[@]} classes"
          rc=0
          run_classes "${CLASSES[@]}" 2>&1 | tee "$UI_SMOKE_LOG" || rc=$?
          if [ "$rc" -ne 0 ]; then
            # `|| true`: a failure with no class-level line (the app died before
            # any suite finished) must still reach the retry and its diagnostic,
            # not abort this step on grep's non-zero status under pipefail.
            flaked=$({ grep -oE "Test Suite '[A-Za-z0-9_]+' failed" "$UI_SMOKE_LOG" \
              | sed -E "s/.*'([A-Za-z0-9_]+)'.*/\1/" | sort -u | tr '\n' ' '; } || true)
            echo "::warning::UI smoke failed (${flaked:-no curated class named}); one targeted retry of the curated classes"
            run_classes "${CLASSES[@]}" 2>&1 | tee -a "$UI_SMOKE_LOG" || {
              echo "::error::the UI smoke classes failed again on the targeted retry - not a runner flake"
              exit 1
            }
            echo "::warning::runner-level flake absorbed: ${flaked:-a curated class} failed, then the targeted retry passed"
          fi

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

  # Single stable branch-protection check. The smoke jobs are the safety net;
  # the exhaustive verdict for a release comes from the Mac local gate, which
  # never runs on GitHub runners.
  ci-gate:
    name: CI Gate
    needs: [plan, build, unit-smoke, ui-smoke, self-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Enforce final CI verdict
        run: |
          python3 scripts/ci-gate.py \
            --plan "${{ needs.plan.result }}" \
            --build "${{ needs.build.result }}" \
            --unit-smoke "${{ needs.unit-smoke.result }}" \
            --ui-smoke "${{ needs.ui-smoke.result }}" \
            --self-test "${{ needs.self-test.result }}"
