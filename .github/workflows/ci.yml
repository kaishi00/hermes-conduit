name: CI

# CI v2 - timing-aware dynamic test lanes for Hermes Conduit.
#
# Architecture (docs/CI.md):
#   plan      (ubuntu, cheap)  validate inventory, balance test classes into
#                              a dynamic number of timing-weighted lanes
#                              (unit AND UI), emit both matrices. The
#                              minutes-long CI-tooling meta-suites are NOT
#                              run here - they must never delay the macOS
#                              build or risk the job timeout.
#   self-test (ubuntu)         CI-tooling regression suites (planner,
#                              lane-runner state machine, destination
#                              lookup, gate/timing contracts) as their own
#                              job, concurrent with build.
#   build     (macos, once)    build-for-testing exactly once into a
#                              workspace-anchored DerivedData path; audit the
#                              generated .xctestrun for absolute-path
#                              portability; upload products as an artifact.
#   unit/ui   (macos, matrix) test-without-building from the downloaded
#                             products; measured watchdogs; native flake
#                             retry (units); one batched invocation per UI
#                             shard with method-precise retry of only the
#                             failed tests and a per-class diagnosis
#                             fallback for timeouts/infrastructure wedges.
#   unit-recovery-plan (ubuntu, always)
#                             classify each finished unit lane from its
#                             lane-result.json. A lane whose PRIMARY
#                             invocation watchdogs with zero identified
#                             test failures is a recoverable infrastructure
#                             stall and becomes one entry in the recovery
#                             matrix (rebuilt from the authoritative plan).
#   unit-recovery (macos-26, matrix, only affected lanes)
#                             re-runs exactly those lanes ONCE on a NEW
#                             GitHub-hosted runner - runs-on allocates a
#                             different Mac than the stalled job, which a
#                             retry inside one job never could. The run is
#                             marked --fresh-runner-recovery and is FINAL:
#                             a retry that fails or stalls again is red
#                             (no third attempt).
#   report   (ubuntu, always) aggregate lane results into the step summary.
#   timing-history-update (main only) EWMA-merge fresh per-class timings into
#                             the timing-history cache, gated on the
#                             adjudicated FINAL unit verdict - a recovered
#                             run still updates (minus the recovered lane's
#                             timings); a genuinely red run never does.
#
# A compilation failure fails the build job and never spawns test lanes.
# Cancellation of superseded runs is preserved per-PR/per-branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Known simulator, used directly as the xcodebuild destination - no
  # 'simctl list' enumeration on the happy path. macos-26 images ship the
  # iPhone 17 family; override here if an image refresh renames devices.
  SIMULATOR_NAME: "iPhone 17 Pro"
  # Workspace-anchored DerivedData: GITHUB_WORKSPACE is byte-identical across
  # GitHub-hosted runners for this repo (/Users/runner/work/<repo>/<repo>),
  # so absolute paths inside the .xctestrun stay valid after the artifact
  # round-trip - no path rewriting involved.
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"

jobs:
  plan:
    name: Plan & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: "${{ steps.plan.outputs.matrix }}"
      lane-count: "${{ steps.plan.outputs.lane-count }}"
      ui-matrix: "${{ steps.plan.outputs.ui-matrix }}"
      ui-classes: "${{ steps.plan.outputs.ui-classes }}"
    steps:
      - uses: actions/checkout@v7

      - name: Restore timing history (read-only; PR runs never save it)
        uses: actions/cache/restore@v4
        with:
          path: ci-timing
          key: timing-history-v1-${{ github.run_number }}
          restore-keys: |
            timing-history-v1-

      - name: Validate inventory + planner regression tests
        env:
          # The minutes-long bash meta-suites (lane-runner state machine,
          # destination lookup) run in the dedicated self-test job - they
          # must never delay planning, the macOS build, or risk this job's
          # timeout (run 34420978966: the suite outlived the 10-minute job
          # ceiling and GitHub cancelled it mid-run).
          CONDUIT_CI_SKIP_BASH_WRAPPER_TESTS: "1"
        run: |
          set -euo pipefail
          HISTORY_ARG=""
          if [ -f ci-timing/timing-history.json ]; then
            HISTORY_ARG="--history ci-timing/timing-history.json"
          fi
          # Cheap Linux guard: every discovered XCTestCase class must be
          # planned exactly once (replaces the static shard-coverage check).
          python3 scripts/plan-tests.py validate --repo-root . \
            --baseline scripts/test-timings.json $HISTORY_ARG
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Localization catalog coverage
        # Cheap Linux guard: every String(localized:) / SwiftUI literal call
        # site must resolve to a key in Conduit/Localizable.xcstrings, so a
        # translated string can never silently render English again.
        run: python3 scripts/check-l10n-coverage.py --repo-root .

      - name: Generate execution plan
        id: plan
        run: |
          set -euo pipefail
          HISTORY_ARG=""
          if [ -f ci-timing/timing-history.json ]; then
            HISTORY_ARG="--history ci-timing/timing-history.json"
          fi
          mkdir -p ci-artifacts
          python3 scripts/plan-tests.py plan --repo-root . \
            --baseline scripts/test-timings.json $HISTORY_ARG \
            --out ci-artifacts/plan.json \
            --matrix-out ci-artifacts/unit-matrix.json \
            --ui-matrix-out ci-artifacts/ui-matrix.json \
            --summary-out ci-artifacts/plan-summary.md
          echo "matrix=$(jq -c . ci-artifacts/unit-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "lane-count=$(jq -r '.lane_count' ci-artifacts/plan.json)" >> "$GITHUB_OUTPUT"
          echo "ui-matrix=$(jq -c . ci-artifacts/ui-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "ui-classes=$(jq -r '[.ui_lanes[].classes[]] | join(",")' ci-artifacts/plan.json)" >> "$GITHUB_OUTPUT"

      - name: Plan summary
        run: cat ci-artifacts/plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: ci-artifacts/
          retention-days: 7

  self-test:
    name: CI tooling self-test
    # No `needs`: the meta-suites test the CI tooling itself, not this run's
    # plan, so they start immediately and run CONCURRENTLY with the macOS
    # build instead of serially delaying it.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Run CI tooling regression suites
        # Full discovery INCLUDING the bash state-machine suites. The
        # timeout layering must hold: per-case synthetic-hang watchdogs
        # (<= 6s) < the wrapper's subprocess cap (480s, test_lane_runner.py)
        # < this job ceiling (12m) - GitHub must never be the first layer to
        # kill a regression suite.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  build:
    name: Build test products
    needs: plan
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing (exactly once)
        env:
          BUILD_TIMEOUT_SECS: 900
        run: bash scripts/ci-build-for-testing.sh

      - name: Audit .xctestrun portability
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Prune intermediates from the products tree
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA_PATH/Build/Intermediates.noindex" \
                 "$DERIVED_DATA_PATH/Index" \
                 "$DERIVED_DATA_PATH/Logs"

      - name: Upload build products (consumed by every lane)
        # Relative path (mirrors the working metadata upload); the artifact
        # keeps the Build/... structure, and lanes restore it under
        # $DERIVED_DATA_PATH/Build so the .xctestrun's absolute paths hold.
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: ci-derived-data/Build
          retention-days: 1
          if-no-files-found: error

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-meta
          path: ci-lane/build/
          retention-days: 7
          if-no-files-found: ignore

  unit:
    name: "Unit - ${{ matrix.lane }}"
    needs: [plan, build]
    runs-on: macos-26
    # Outer emergency ceiling only: attempt 1 + attempt 2 + a full isolation
    # pass plus bounded resets all fit underneath it (see plan-tests.py).
    timeout-minutes: ${{ matrix.job_timeout_min }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download shared build products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: "${{ env.DERIVED_DATA_PATH }}/Build"

      - name: Verify restored .xctestrun paths
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          echo "XCRUN_FILE=$XCRUN_FILE" >> "$GITHUB_ENV"
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Run unit lane
        # Matrix values enter through the environment, never through bash
        # template interpolation, so even a hostile class name cannot become
        # code execution in the runner.
        env:
          CLASS_TIMEOUT_MIN_S: "180"
          CLASS_TIMEOUT_MULTIPLIER: "4.0"
          CONDUIT_PERF_TRACE: "1"
          LANE_NAME: "${{ matrix.lane }}"
          LANE_TARGET: "${{ matrix.target }}"
          LANE_CLASSES: "${{ matrix.classes }}"
          LANE_CLASS_ESTIMATES: "${{ matrix.class_estimates }}"
          LANE_PREDICTED: "${{ matrix.predicted_s }}"
          LANE_TIMEOUT: "${{ matrix.timeout_s }}"
        run: |
          bash scripts/ci-test-lane.sh \
            --kind unit \
            --lane "$LANE_NAME" \
            --target "$LANE_TARGET" \
            --classes "$LANE_CLASSES" \
            --class-estimates "$LANE_CLASS_ESTIMATES" \
            --predicted "$LANE_PREDICTED" \
            --timeout "$LANE_TIMEOUT" \
            --iterations 3 \
            --xctestrun "$XCRUN_FILE" \
            --result-dir "ci-lane/$LANE_NAME"

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

      - name: Upload lane results for report and timing history
        # The run-attempt suffix keeps re-run uploads distinct from the
        # previous attempt's artifacts, so consumers can order them
        # deterministically (newest finished_at wins).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: ci-lane/
          retention-days: 7
          if-no-files-found: error

  unit-recovery-plan:
    name: Plan unit recovery
    # Classify every finished unit lane and decide whether any needs a
    # fresh-runner retry. Runs even when the unit matrix failed (an
    # infrastructure stall IS a unit failure); an empty recovery matrix is
    # the healthy outcome.
    needs: [plan, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: "${{ steps.recovery.outputs.matrix }}"
      recovery-count: "${{ steps.recovery.outputs.recovery-count }}"
    steps:
      - uses: actions/checkout@v7

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ci-recovery/plan

      - name: Download unit lane results
        # The plan remains the lane-membership authority: every recovery
        # entry is rebuilt from plan.json, and any lane result that
        # disagrees with the plan fails closed (ci-recovery-plan.py).
        if: needs.unit.result == 'success' || needs.unit.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: lane-unit-*
          path: ci-recovery/lanes

      - name: Classify lanes and plan fresh-runner recovery
        id: recovery
        run: |
          set -euo pipefail
          python3 scripts/ci-recovery-plan.py \
            --plan-json ci-recovery/plan/plan.json \
            --lanes-dir ci-recovery/lanes \
            --unit-result "${{ needs.unit.result }}" \
            --matrix-out ci-recovery/unit-recovery-matrix.json
          echo "matrix=$(jq -c . ci-recovery/unit-recovery-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "recovery-count=$(jq -r '.include | length' ci-recovery/unit-recovery-matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Upload recovery plan (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-recovery-matrix-attempt-${{ github.run_attempt }}
          path: ci-recovery/unit-recovery-matrix.json
          retention-days: 7
          if-no-files-found: error

  unit-recovery:
    name: "Unit recovery - ${{ matrix.lane }} (fresh runner)"
    # The ONLY second attempt in the pipeline, and it happens on a NEW
    # GitHub-hosted macOS runner: runs-on allocates another machine than the
    # one that stalled. The lane runs once, marked
    # --fresh-runner-recovery; any failure or timeout here is final
    # (the gate fails closed on the lane - there is no third attempt).
    needs: [plan, build, unit-recovery-plan]
    if: >-
      always() &&
      needs.unit-recovery-plan.result == 'success' &&
      needs.build.result == 'success' &&
      needs.unit-recovery-plan.outputs.recovery-count != '0'
    runs-on: macos-26
    timeout-minutes: ${{ matrix.job_timeout_min }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.unit-recovery-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download shared build products
        # Same commit (checkout pins the triggering SHA), same build
        # products, same lane membership - only the runner is new.
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: "${{ env.DERIVED_DATA_PATH }}/Build"

      - name: Verify restored .xctestrun paths
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          echo "XCRUN_FILE=$XCRUN_FILE" >> "$GITHUB_ENV"
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Run unit lane (fresh-runner recovery)
        # Matrix values enter through the environment, never through bash
        # template interpolation (same rule as the primary unit job). The
        # recovery flag marks the lane result so the gate can never grant
        # another recovery, and it is the anti-recursion fence: a
        # classification out of this run is never recovery-eligible.
        env:
          CLASS_TIMEOUT_MIN_S: "180"
          CLASS_TIMEOUT_MULTIPLIER: "4.0"
          CONDUIT_PERF_TRACE: "1"
          LANE_NAME: "${{ matrix.lane }}"
          LANE_TARGET: "${{ matrix.target }}"
          LANE_CLASSES: "${{ matrix.classes }}"
          LANE_CLASS_ESTIMATES: "${{ matrix.class_estimates }}"
          LANE_PREDICTED: "${{ matrix.predicted_s }}"
          LANE_TIMEOUT: "${{ matrix.timeout_s }}"
        run: |
          bash scripts/ci-test-lane.sh \
            --kind unit \
            --lane "$LANE_NAME" \
            --target "$LANE_TARGET" \
            --classes "$LANE_CLASSES" \
            --class-estimates "$LANE_CLASS_ESTIMATES" \
            --predicted "$LANE_PREDICTED" \
            --timeout "$LANE_TIMEOUT" \
            --iterations 3 \
            --xctestrun "$XCRUN_FILE" \
            --result-dir "ci-lane/$LANE_NAME" \
            --fresh-runner-recovery

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

      - name: Upload recovery lane results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-recovery-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: ci-lane/
          retention-days: 7
          if-no-files-found: error

  ui:
    name: "UI - ${{ matrix.lane }}"
    needs: [plan, build]
    if: needs.plan.outputs.ui-classes != ''
    runs-on: macos-26
    # Outer emergency ceiling only: every class's targeted retry plus bounded
    # resets and setup slack all fit underneath it (see plan-tests.py); the
    # per-class watchdogs inside ci-test-lane.sh are the real enforcement.
    timeout-minutes: ${{ matrix.job_timeout_min }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ui-matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download shared build products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: "${{ env.DERIVED_DATA_PATH }}/Build"

      - name: Verify restored .xctestrun paths
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          echo "XCRUN_FILE=$XCRUN_FILE" >> "$GITHUB_ENV"
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Run UI lane
        # Matrix values enter through the environment, never through bash
        # template interpolation, so even a hostile class name cannot become
        # code execution in the runner. The lane runner executes all of the
        # shard's classes in ONE batched xcodebuild invocation (watchdog =
        # sum of the planner's per-class budgets; --class-timeouts is the
        # single source of watchdog policy and must cover every assigned
        # class). A failing batch retries exactly the non-passing tests -
        # once - and falls back to per-class diagnosis for
        # timeouts/infrastructure wedges.
        env:
          CONDUIT_PERF_TRACE: "1"
          LANE_NAME: "${{ matrix.lane }}"
          LANE_TARGET: "${{ matrix.target }}"
          LANE_CLASSES: "${{ matrix.classes }}"
          LANE_CLASS_ESTIMATES: "${{ matrix.class_estimates }}"
          LANE_CLASS_TIMEOUTS: "${{ matrix.class_timeouts }}"
          LANE_PREDICTED: "${{ matrix.predicted_s }}"
          LANE_TIMEOUT: "${{ matrix.timeout_s }}"
        run: |
          bash scripts/ci-test-lane.sh \
            --kind ui \
            --lane "$LANE_NAME" \
            --target "$LANE_TARGET" \
            --classes "$LANE_CLASSES" \
            --class-estimates "$LANE_CLASS_ESTIMATES" \
            --class-timeouts "$LANE_CLASS_TIMEOUTS" \
            --predicted "$LANE_PREDICTED" \
            --timeout "$LANE_TIMEOUT" \
            --xctestrun "$XCRUN_FILE" \
            --result-dir "ci-lane/$LANE_NAME"

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

      - name: Upload lane results for report and timing history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: ci-lane/
          retention-days: 7
          if-no-files-found: error

  report:
    name: Report
    needs: [plan, build, unit, unit-recovery-plan, unit-recovery, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ci-report/plan
        continue-on-error: true

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: build-meta
          path: ci-report/build
        continue-on-error: true

      - name: Download lane results
        # No merge-multiple: each artifact extracts into its own name-derived
        # directory (lane-unit-1/...), so same-named files can never collide.
        uses: actions/download-artifact@v4
        with:
          pattern: lane-*
          path: ci-report/lanes
        continue-on-error: true

      - name: Build CI Test Report
        if: always()
        run: |
          python3 scripts/extract-test-timings.py aggregate \
            --plan ci-report/plan/plan.json \
            --lanes-dir ci-report/lanes \
            --build-result ci-report/build/build-result.json \
            --out ci-report/summary.md || true
          if [ -f ci-report/plan/plan-summary.md ]; then
            cat ci-report/plan/plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f ci-report/summary.md ]; then
            cat ci-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # Single stable branch-protection check. The number of dynamic unit lanes
  # can change run to run, so individual lane jobs must never be required
  # directly - require "CI Gate" instead (see docs/CI.md). The gate no
  # longer reads needs.unit.result as the unit truth: it adjudicates every
  # planned lane's lane-result.json against the plan (scripts/ci-gate.py),
  # accepting exactly one fresh-runner recovery pass for a lane whose
  # primary invocation stalled with zero identified test failures.
  ci-gate:
    name: CI Gate
    needs: [plan, build, unit, ui, self-test, unit-recovery-plan, unit-recovery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download plan
        # Tolerated download: the gate script fails closed with a precise
        # reason when an artifact is missing (missing metadata = FAIL).
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ci-gate/plan

      - name: Download unit lane results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: lane-unit-*
          path: ci-gate/lanes

      - name: Download fresh-runner recovery results
        if: >-
          needs.unit-recovery-plan.result == 'success' &&
          needs.unit-recovery-plan.outputs.recovery-count != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: lane-recovery-*
          path: ci-gate/recovery

      - name: Enforce final CI verdict
        run: |
          python3 scripts/ci-gate.py \
            --plan "${{ needs.plan.result }}" \
            --build "${{ needs.build.result }}" \
            --unit "${{ needs.unit.result }}" \
            --ui "${{ needs.ui.result }}" \
            --self-test "${{ needs.self-test.result }}" \
            --recovery-plan "${{ needs.unit-recovery-plan.result }}" \
            --recovery "${{ needs.unit-recovery.result }}" \
            --plan-json ci-gate/plan/plan.json \
            --unit-lanes-dir ci-gate/lanes \
            --recovery-lanes-dir ci-gate/recovery

  timing-history-update:
    name: Update timing history
    needs: [plan, unit, unit-recovery-plan, unit-recovery, ui]
    # Only main runs with a green FINAL unit verdict evolve the estimates:
    # needs.unit.result == 'success', OR the failure was redeemed by the
    # fresh-runner recovery (the in-step adjudication re-checks every lane,
    # so a red lane hiding next to a recovered one still blocks the update).
    # PR runs never write.
    if: >-
      github.ref == 'refs/heads/main' &&
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.unit-recovery-plan.result == 'success' &&
      (needs.unit.result == 'success' || needs.unit-recovery.result == 'success') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Restore current timing history
        uses: actions/cache/restore@v4
        with:
          path: ci-timing
          key: timing-history-v1-${{ github.run_number }}
          restore-keys: |
            timing-history-v1-

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: ci-update/plan
        continue-on-error: true

      - name: Download lane observations
        uses: actions/download-artifact@v4
        with:
          pattern: lane-*
          path: ci-update/lanes
        continue-on-error: true

      - name: Merge fresh timings into history (EWMA)
        run: |
          set -euo pipefail
          if [ ! -f ci-update/plan/plan.json ]; then
            echo "plan artifact missing; skipping timing history update"
            exit 0
          fi
          # Final-verdict preflight: the update proceeds only when every
          # planned unit lane ends green (pass or exactly one fresh-runner
          # recovery pass). A genuinely red main run - including one where a
          # real test failure sits next to a recovered lane - keeps the
          # previous history.
          if ! python3 scripts/ci_lane_recovery.py adjudicate \
              --plan-json ci-update/plan/plan.json \
              --unit-lanes-dir ci-update/lanes \
              --recovery-lanes-dir ci-update/lanes; then
            echo "final unit verdict is red; keeping previous history"
            exit 0
          fi
          mkdir -p ci-timing
          OBS=$(find ci-update/lanes -name observations.json 2>/dev/null | sort)
          if [ -z "$OBS" ]; then
            echo "no lane observations found - keeping previous history"
            exit 0
          fi
          # The recovered lanes' own observations are excluded downstream via
          # their paired lane results (--lane-results): only primary lanes
          # whose result is a clean pass merge; the stalled invocation's
          # partial timings and the recovery run's timings never do.
          LRS=$(find ci-update/lanes -name lane-result.json 2>/dev/null | sort)
          HIST=""
          if [ -f ci-timing/timing-history.json ]; then
            HIST="--history ci-timing/timing-history.json"
          fi
          # OBS/LRS must expand to separate paths here; no spaces on runners.
          # The flags below must mirror update-timing-history.py's CLI exactly
          # (scripts/tests/test_timing_history.py pins this contract).
          python3 scripts/update-timing-history.py \
            --observations $OBS \
            --lane-results $LRS \
            --inventory ci-update/plan/plan.json \
            $HIST \
            --out ci-timing/timing-history.json

      - name: Save updated timing history
        if: hashFiles('ci-timing/timing-history.json') != ''
        # Re-runs of the same workflow run reuse the run_number key; saving to
        # an existing key is an acceptable no-op, not a failure.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ci-timing
          key: timing-history-v1-${{ github.run_number }}

      - name: Upload timing history (durable backup)
        if: hashFiles('ci-timing/timing-history.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: timing-history
          path: ci-timing/timing-history.json
          retention-days: 90