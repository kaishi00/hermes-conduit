name: Stress (temporary)

# Temporary, removed before the PR: runs unit tests repeatedly under CPU
# load (`yes` hogs once tests run) to confirm the fixed condition waits hold
# and to measure how long they take. Triggered by pushes to this work branch
# only; one job, so it never holds more than one macOS runner.

on:
  push:
    branches: [claude/project-thread-2eews6]

permissions:
  contents: read

env:
  SIMULATOR_NAME: "iPhone 17 Pro"
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"

jobs:
  stress:
    name: Stress (fixed waits, traced)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Trace the condition waits (stress only)
        run: git apply .github/stress-tmp/settle-trace.patch

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Pick the build cache
        id: cache-key
        run: |
          set -euo pipefail
          xcode=$(xcodebuild -version | awk 'NR==1 {v=$2} /Build version/ {b=$3} END {print v "-" b}')
          echo "prefix=dd-v1-slim-$xcode-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"
          echo "xcode-prefix=dd-v1-slim-$xcode" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ci-derived-data
            !ci-derived-data/Logs
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
            ${{ steps.cache-key.outputs.xcode-prefix }}-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project-tests.yml

      - name: Build and boot the simulator in parallel
        env:
          BUILD_TIMEOUT_SECS: 1200
          BUILD_CACHE: stress
        run: bash scripts/ci-hosted-build.sh

      - name: Shard 1 batch 2 as CI runs it, 4 times
        run: bash .github/stress-tmp/run-stress.sh ci-batch 2 4 "batch 2 x4"

      - name: Voice-live tests, 20 iterations
        if: ${{ !cancelled() }}
        run: bash .github/stress-tmp/run-stress.sh voice-live 20 "voice-live x20"
