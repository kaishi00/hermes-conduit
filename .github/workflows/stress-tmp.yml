name: Stress (temporary)

# Temporary, removed before the PR: runs unit tests repeatedly under CPU
# load (-test-iterations plus `yes` hogs) to find and confirm hosted-only
# timing flakes. Triggered by pushes to this work branch only. One job at a
# time, so it never holds more than one macOS runner.

on:
  push:
    branches: [claude/project-thread-2eews6]

permissions:
  contents: read

env:
  SIMULATOR_NAME: "iPhone 17 Pro"
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"
  # The branch's base on main: "before" runs use its test files.
  BASE_SHA: 5f685d4c15c31fedc374c12cb858671e57238d20

jobs:
  stress:
    name: Stress (${{ matrix.label }})
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - label: voice-live before
            suite: voice-live
            iterations: 40
            before: true
          - label: voice-live after
            suite: voice-live
            iterations: 40
            before: false
          - label: shard 1 rest
            suite: shard1-rest
            iterations: 3
            before: false
    steps:
      - uses: actions/checkout@v7

      - name: Use main's voice test files
        if: matrix.before
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          git checkout FETCH_HEAD -- ConduitTests/GeminiLiveVoiceTests.swift ConduitTests/GrokLiveVoiceTests.swift
          git status --short

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Pick the build cache
        id: cache-key
        run: |
          set -euo pipefail
          xcode=$(xcodebuild -version | awk 'NR==1 {v=$2} /Build version/ {b=$3} END {print v "-" b}')
          echo "prefix=dd-v1-slim-$xcode-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"
          echo "xcode-prefix=dd-v1-slim-$xcode" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ci-derived-data
            !ci-derived-data/Logs
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
            ${{ steps.cache-key.outputs.xcode-prefix }}-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project-tests.yml

      - name: Build and boot the simulator in parallel
        env:
          BUILD_TIMEOUT_SECS: 1200
          BUILD_CACHE: stress
        run: bash scripts/ci-hosted-build.sh

      - name: Run the tests repeatedly under CPU load
        run: bash .github/stress-tmp/run-stress.sh "${{ matrix.suite }}" "${{ matrix.iterations }}" "${{ matrix.label }}"
