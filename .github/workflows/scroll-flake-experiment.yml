name: Scroll flake experiment

# Temporary: repeats ChatScrollHostedTests on a hosted runner to catch the
# testLoadingEarlierMessagesKeepsTheReaderInPlace flake with diagnostics.
# Removed before the fix merges.

on:
  push:
    branches: [claude/project-thread-tv8glg]

concurrency:
  group: scroll-flake-experiment
  cancel-in-progress: true

permissions:
  contents: read

env:
  SIMULATOR_NAME: "iPhone 17 Pro"
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"

jobs:
  stress:
    name: Hosted scroll stress
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and boot the simulator in parallel
        env:
          BUILD_TIMEOUT_SECS: 900
        run: bash scripts/ci-hosted-build.sh

      - name: Run the hosted scroll class repeatedly
        run: |
          set -uo pipefail
          run_round() {
            echo "::group::round $1 ($2)"
            if ! xcodebuild test-without-building \
              -xctestrun "$XCRUN_FILE" \
              -destination "$DESTINATION" \
              -parallel-testing-enabled NO \
              -collect-test-diagnostics never \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 \
              -test-iterations 6 \
              -only-testing:ConduitTests/ChatScrollHostedTests; then
              echo "::warning::round $1 ($2) had failures"
            fi
            echo "::endgroup::"
          }
          run_round 1 idle
          run_round 2 idle
          # A busy runner: two CPU hogs alongside the simulator.
          yes > /dev/null & hog1=$!
          yes > /dev/null & hog2=$!
          run_round 3 loaded
          run_round 4 loaded
          kill "$hog1" "$hog2" || true
