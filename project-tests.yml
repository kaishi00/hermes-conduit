# xcodegen overlay for CI test builds: `xcodegen generate --spec project-tests.yml`.
#
# The tests run the iPhone app only, so this drops what the app embeds but no
# test exercises: the Apple Watch app (a second platform, compiled from
# scratch on every run) and the app extensions. Everything else is
# project.yml unchanged. Only the nightly unit shards build it; Smoke (every
# PR and push, ci.yml), the nightly timing and UI jobs and every TestFlight
# archive build the full app.
include:
  - path: project.yml
targets:
  Conduit:
    dependencies:REPLACE:
      - package: WebRTC
