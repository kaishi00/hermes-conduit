# xcodegen overlay for CI test builds: `xcodegen generate --spec project-tests.yml`.
#
# The tests run the iPhone app only, so this drops what the app embeds but no
# test exercises: the Apple Watch app (a second platform, compiled from
# scratch on every run) and the three app extensions. Everything else is
# project.yml unchanged. The full app is still built by the UI smoke job when a
# PR touches those targets' sources (ci.yml, plan job), by the nightly run and
# by every TestFlight archive.
include:
  - path: project.yml
targets:
  Conduit:
    dependencies:REPLACE:
      - package: WebRTC
